<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DermaScan AI — Detailed Report</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --mint: #E8F7F2;
            --mint-2: #C2EAD9;
            --mint-3: #8DD4B8;
            --mint-4: #3DAF87;
            --mint-5: #1F8C68;
            --mint-6: #0F6347;
            --peach: #FDF0EA;
            --peach-2: #F9CFBA;
            --peach-3: #E8956E;
            --cream: #FAFAF7;
            --warm-gray: #F2F0EB;
            --text-dark: #1A2420;
            --text-mid: #3D5249;
            --text-light: #6B867C;
            --white: #FFFFFF;
            --border: rgba(30, 80, 60, 0.1);
            --shadow: 0 2px 20px rgba(15, 99, 71, 0.08);
            --shadow-md: 0 8px 40px rgba(15, 99, 71, 0.12);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--mint) 100%);
            padding: 40px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--white);
            border-radius: 32px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        /* Header */
        .report-header {
            background: linear-gradient(135deg, var(--mint-5) 0%, var(--mint-6) 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .report-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
        }

        .report-id {
            margin-top: 10px;
            opacity: 0.8;
            font-size: 0.8rem;
        }

        /* Content */
        .report-content {
            padding: 30px;
        }

        /* Image Section */
        .image-section {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--cream);
            border-radius: 20px;
        }

        .image-section h3 {
            margin-bottom: 15px;
            color: var(--mint-6);
        }

        .analyzed-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
        }

        /* Primary Diagnosis */
        .primary-diagnosis {
            background: linear-gradient(135deg, var(--mint) 0%, var(--white) 100%);
            border: 2px solid var(--mint-3);
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            margin-bottom: 30px;
        }

        .primary-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--mint-6);
        }

        .primary-disease {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-dark);
            margin: 10px 0;
        }

        .confidence-score {
            font-size: 1.2rem;
            margin-top: 10px;
        }

        .confidence-bar {
            background: var(--warm-gray);
            border-radius: 12px;
            height: 20px;
            overflow: hidden;
            margin: 15px 0;
        }

        .confidence-fill {
            background: linear-gradient(90deg, var(--mint-5), var(--mint-3));
            height: 100%;
            border-radius: 12px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .info-card {
            background: var(--cream);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--mint-5);
        }

        .info-label {
            font-size: 0.7rem;
            color: var(--text-light);
        }

        /* Charts Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: var(--cream);
            border-radius: 20px;
            padding: 20px;
        }

        .chart-title {
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
            color: var(--text-mid);
        }

        .chart-container {
            position: relative;
            height: 250px;
        }

        /* Top Predictions Table */
        .predictions-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        .predictions-table th,
        .predictions-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .predictions-table th {
            background: var(--mint-5);
            color: white;
        }

        .predictions-table tr:hover {
            background: var(--mint);
        }

        .rank-1 {
            background: rgba(31, 140, 104, 0.1);
            font-weight: bold;
        }

        /* Disclaimer */
        .disclaimer {
            background: #FFF8E7;
            border-left: 4px solid var(--peach-3);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        /* Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-primary,
        .btn-secondary {
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: var(--mint-5);
            color: white;
        }

        .btn-primary:hover {
            background: var(--mint-6);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--white);
            color: var(--text-mid);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--mint-3);
            color: var(--mint-5);
        }

        .loading,
        .error {
            text-align: center;
            padding: 50px;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .primary-disease {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="container" id="reportContainer">
        <div class="loading">
            <div class="spinner-circle"
                style="width:50px;height:50px;border:3px solid var(--mint-2);border-top-color:var(--mint-5);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px;">
            </div>
            <p>Loading report...</p>
        </div>
    </div>

    <style>
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>

    <script>
        function getSessionToken() {
            return localStorage.getItem('session_token');
        }

        async function loadReport() {
            const urlParams = new URLSearchParams(window.location.search);
            const predictionId = urlParams.get('prediction_id');

            if (!predictionId) {
                document.getElementById('reportContainer').innerHTML = `
        <div class="error">
          <h3>❌ No Prediction ID Provided</h3>
          <p>Please select a report from your history page.</p>
          <div class="action-buttons">
            <a href="/history" class="btn-primary">Go to History</a>
            <a href="/detection" class="btn-secondary">New Analysis</a>
          </div>
        </div>
      `;
                return;
            }

            const sessionToken = getSessionToken();
            if (!sessionToken) {
                window.location.href = '/login';
                return;
            }

            try {
                // Fetch all predictions
                const response = await fetch('/get-user-predictions', {
                    headers: { 'X-Session-Token': sessionToken }
                });
                const data = await response.json();

                if (data.success && data.predictions) {
                    // Find the specific prediction
                    const prediction = data.predictions.find(p => p.id == predictionId);

                    if (prediction) {
                        displayReport(prediction);
                    } else {
                        document.getElementById('reportContainer').innerHTML = `
            <div class="error">
              <h3>❌ Prediction Not Found</h3>
              <p>The requested report could not be found.</p>
              <div class="action-buttons">
                <a href="/history" class="btn-primary">Go to History</a>
              </div>
            </div>
          `;
                    }
                } else {
                    throw new Error('Failed to load predictions');
                }
            } catch (error) {
                console.error('Error loading report:', error);
                document.getElementById('reportContainer').innerHTML = `
        <div class="error">
          <h3>❌ Error Loading Report</h3>
          <p>${error.message}</p>
          <div class="action-buttons">
            <a href="/history" class="btn-primary">Go to History</a>
          </div>
        </div>
      `;
            }
        }

        function displayReport(prediction) {
            const top1 = prediction.top5_predictions[0];
            const confidence = prediction.confidence;
            const confidenceLevel = confidence > 70 ? 'High' : (confidence > 40 ? 'Medium' : 'Low');
            const confidenceColor = confidence > 70 ? 'var(--mint-5)' : (confidence > 40 ? 'var(--peach-3)' : 'var(--peach-2)');

            // Prepare chart data
            const labels = prediction.top5_predictions.map(p => {
                let name = p.label;
                return name.length > 15 ? name.substring(0, 12) + '...' : name;
            });
            const percentages = prediction.top5_predictions.map(p => p.confidence);
            const colors = ['#1F8C68', '#3DAF87', '#8DD4B8', '#E8956E', '#F9CFBA'];

            // Format date
            const reportDate = new Date(prediction.timestamp).toLocaleString();

            // Determine image source
            let imageHtml = '';
            if (prediction.image_url) {
                if (prediction.image_url.startsWith('http') || prediction.image_url.startsWith('/static')) {
                    imageHtml = `<img src="${prediction.image_url}" class="analyzed-image" alt="Analyzed Image" onerror="this.onerror=null; this.src='https://via.placeholder.com/400x300?text=Image+Not+Available'">`;
                } else if (prediction.image_url === 'base64_uploaded_image') {
                    imageHtml = `<div style="padding: 40px; background: var(--cream); border-radius: 16px;">
                      <p>📸 Base64 Image Uploaded</p>
                      <small>Image was uploaded as base64 format</small>
                    </div>`;
                } else {
                    imageHtml = `<img src="${prediction.image_url}" class="analyzed-image" alt="Analyzed Image" onerror="this.onerror=null; this.src='https://via.placeholder.com/400x300?text=Image+Not+Available'">`;
                }
            } else {
                imageHtml = `<div style="padding: 40px; background: var(--cream); border-radius: 16px;">
                    <p>📸 No image available</p>
                    <small>Image URL not saved for this prediction</small>
                  </div>`;
            }

            // Build top predictions table
            let tableHtml = '';
            prediction.top5_predictions.forEach((pred, index) => {
                const rank = index + 1;
                const rankClass = rank === 1 ? 'rank-1' : '';
                const medal = rank === 1 ? '🥇' : (rank === 2 ? '🥈' : (rank === 3 ? '🥉' : (rank === 4 ? '📊' : '📋')));
                tableHtml += `
        <tr class="${rankClass}">
          <td style="text-align: center;">${medal}</td>
          <td><strong>${rank === 1 ? '⭐ ' : ''}${escapeHtml(pred.label)}</strong></td>
          <td style="text-align: center;">
            <div style="background: var(--warm-gray); border-radius: 10px; height: 8px; width: 100%; overflow: hidden;">
              <div style="background: ${colors[index]}; width: ${pred.confidence}%; height: 100%;"></div>
            </div>
          </td>
          <td style="text-align: center;"><strong>${pred.confidence}%</strong></td>
        </tr>
      `;
            });

            const html = `
      <div class="report-header">
        <h1>🩺 DermaScan AI Report</h1>
        <div class="report-id">Report ID: ${prediction.id} | ${reportDate}</div>
        <div class="report-id">Detection Type: ${prediction.prediction_type === 'file_upload' ? '📁 File Upload' : '🔗 URL Analysis'}</div>
      </div>
      
      <div class="report-content">
        <!-- Analyzed Image Section -->
        <div class="image-section">
          <h3>📸 Analyzed Image</h3>
          ${imageHtml}
          ${prediction.prediction_type === 'url' && prediction.image_url && !prediction.image_url.startsWith('/static') && !prediction.image_url.startsWith('base64') ?
                    `<p style="margin-top: 10px; font-size: 0.7rem; color: var(--text-light);">Source URL: <a href="${prediction.image_url}" target="_blank">${prediction.image_url.substring(0, 50)}...</a></p>` : ''}
        </div>
        
        <!-- Primary Diagnosis -->
        <div class="primary-diagnosis">
          <div class="primary-label">PRIMARY DIAGNOSIS</div>
          <div class="primary-disease">${escapeHtml(prediction.primary_diagnosis)}</div>
          <div class="confidence-score">with ${confidence}% confidence</div>
          <div class="confidence-bar">
            <div class="confidence-fill" style="width: ${confidence}%">${confidence}%</div>
          </div>
          <div style="margin-top: 10px;">
            <span style="background: ${confidenceColor}; padding: 4px 15px; border-radius: 20px; font-size: 0.8rem;">${confidenceLevel} Confidence</span>
          </div>
        </div>
        
        <!-- Info Grid -->
        <div class="info-grid">
          <div class="info-card">
            <div class="info-value">${confidence}%</div>
            <div class="info-label">Confidence Score</div>
          </div>
          <div class="info-card">
            <div class="info-value">${prediction.top5_predictions.length}</div>
            <div class="info-label">Top Predictions</div>
          </div>
          <div class="info-card">
            <div class="info-value">31</div>
            <div class="info-label">Disease Classes</div>
          </div>
        </div>
        
        <!-- Charts -->
        <div class="charts-grid">
          <div class="chart-card">
            <div class="chart-title">📊 Top 5 Confidence Bar Chart</div>
            <div class="chart-container">
              <canvas id="barChart"></canvas>
            </div>
          </div>
          <div class="chart-card">
            <div class="chart-title">🥧 Confidence Distribution</div>
            <div class="chart-container">
              <canvas id="doughnutChart"></canvas>
            </div>
          </div>
        </div>
        
        <!-- Top Predictions Table -->
        <h3 style="margin-bottom: 15px;">🏆 Top ${prediction.top5_predictions.length} Predictions</h3>
        <table class="predictions-table">
          <thead>
            <tr><th style="width: 60px;">Rank</th><th>Disease Name</th><th>Confidence Bar</th><th style="width: 80px;">Score</th></tr>
          </thead>
          <tbody>
            ${tableHtml}
          </tbody>
        </table>
        
        <!-- Disclaimer -->
        <div class="disclaimer">
          <strong>⚠️ Medical Disclaimer:</strong><br>
          This is an AI-generated analysis based on Google BiT model. The results are for educational and research purposes only. 
          This is not a substitute for professional medical advice, diagnosis, or treatment. Always seek the advice of a qualified 
          dermatologist or healthcare provider with any questions regarding a medical condition.
        </div>
        
        <!-- Action Buttons -->
        <div class="action-buttons">
          <button class="btn-primary" onclick="downloadReport(${prediction.id})">
            📥 Download PDF Report
          </button>
          <a href="/history" class="btn-secondary">
            📋 Back to History
          </a>
          <a href="/detection" class="btn-secondary">
            🩺 New Analysis
          </a>
        </div>
      </div>
    `;

            document.getElementById('reportContainer').innerHTML = html;

            // Create charts
            setTimeout(() => {
                createBarChart(labels, percentages, colors);
                createDoughnutChart(labels, percentages, colors);
            }, 100);
        }

        function createBarChart(labels, data, colors) {
            const ctx = document.getElementById('barChart')?.getContext('2d');
            if (!ctx) return;

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Confidence (%)',
                        data: data,
                        backgroundColor: colors,
                        borderRadius: 8,
                        barPercentage: 0.7
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: (ctx) => `${ctx.raw}% confidence` } }
                    },
                    scales: {
                        y: { max: 100, title: { display: true, text: 'Confidence %', font: { size: 10 } }, ticks: { font: { size: 9 } } },
                        x: { ticks: { font: { size: 10, weight: 'bold' }, rotation: 15 } }
                    }
                }
            });
        }

        function createDoughnutChart(labels, data, colors) {
            const ctx = document.getElementById('doughnutChart')?.getContext('2d');
            if (!ctx) return;

            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { size: 9 } } },
                        tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${ctx.raw}%` } }
                    },
                    cutout: '50%'
                }
            });
        }

        async function downloadReport(predictionId) {
            const sessionToken = getSessionToken();

            try {
                const response = await fetch(`/download-report/${predictionId}`, {
                    headers: { 'X-Session-Token': sessionToken }
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `DermaScan_Report_${predictionId}.pdf`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                } else {
                    alert('Failed to download report');
                }
            } catch (error) {
                console.error('Download error:', error);
                alert('Error downloading report');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load report on page load
        loadReport();
    </script>

</body>

</html>
