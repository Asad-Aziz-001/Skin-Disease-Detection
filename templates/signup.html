<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - DermaScan AI</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --mint: #E8F7F2;
            --mint-5: #1F8C68;
            --mint-6: #0F6347;
            --cream: #FAFAF7;
            --text-dark: #1A2420;
            --text-light: #6B867C;
            --white: #FFFFFF;
            --border: rgba(30, 80, 60, 0.1);
            --shadow-md: 0 8px 40px rgba(15, 99, 71, 0.12);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--mint) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-container {
            background: var(--white);
            border-radius: 32px;
            box-shadow: var(--shadow-md);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            border: 1px solid var(--border);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--text-dark);
        }

        .logo span {
            color: var(--mint-5);
        }

        .logo p {
            color: var(--text-light);
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 16px;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--mint-5);
            box-shadow: 0 0 0 3px rgba(31, 140, 104, 0.1);
        }

        .btn-signup {
            width: 100%;
            padding: 14px;
            background: var(--mint-5);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-signup:hover {
            background: var(--mint-6);
            transform: translateY(-2px);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: var(--mint-5);
            text-decoration: none;
        }

        .error {
            background: #FEF2F0;
            color: #D93C1E;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .success {
            background: var(--mint);
            color: var(--mint-6);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="signup-container">
        <div class="logo">
            <h1>Derma<span>Scan</span> AI</h1>
            <p>Create your free account</p>
        </div>
        <div id="message"></div>
        <form id="signupForm">
            <div class="form-group">
                <label>Full Name (Optional)</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label>Username *</label>
                <input type="text" id="username" required placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="password" required placeholder="Create a password">
            </div>
            <button type="submit" class="btn-signup">Create Account</button>
        </form>
        <div class="login-link">
            Already have an account? <a href="/login">Login</a>
        </div>
    </div>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                full_name: document.getElementById('fullName').value,
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (result.success) {
                    document.getElementById('message').innerHTML = `<div class="success">✅ ${result.message} Redirecting to login...</div>`;
                    setTimeout(() => { window.location.href = '/login'; }, 2000);
                } else {
                    document.getElementById('message').innerHTML = `<div class="error">❌ ${result.error}</div>`;
                }
            } catch (error) {
                document.getElementById('message').innerHTML = `<div class="error">❌ Network error: ${error.message}</div>`;
            }
        });
    </script>
</body>

</html>
